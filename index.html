<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>So sánh và Chỉnh sửa Hex File</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        .upload-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        textarea { width: 100%; height: 250px; font-family: monospace; font-size: 14px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }
        .diff-container { display: flex; gap: 20px; margin-top: 20px; }
        .diff-box { flex: 1; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        
        /* Khung chứa hiệu ứng tô màu phía sau và textarea chỉnh sửa phía trên */
        .editor-wrapper { position: relative; height: 250px; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; }
        .backdrop, .editable-textarea {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 10px; font-family: monospace; font-size: 14px; line-height: 1.5;
            box-sizing: border-box; white-space: pre-wrap; word-break: break-all; overflow-y: auto;
        }
        .backdrop { color: transparent; pointer-events: none; }
        .editable-textarea {
            background: transparent; color: #333; border: none; outline: none; resize: none;
        }
        .highlight { background-color: #ffcccc; color: #d00; font-weight: bold; }
        
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Công cụ So sánh và Chỉnh sửa Hex</h2>
    
    <div class="upload-container">
        <div class="box">
            <h3>Tải lên File Gốc 1</h3>
            <input type="file" id="file1" onchange="loadFile(1)">
        </div>
        <div class="box">
            <h3>Tải lên File Cần Sửa 2</h3>
            <input type="file" id="file2" onchange="loadFile(2)">
        </div>
    </div>

    <div class="diff-container">
        <div class="diff-box">
            <h3>File 1 (Chỉ xem)</h3>
            <div class="editor-wrapper">
                <div id="backdrop1" class="backdrop"></div>
                <textarea id="text1" class="editable-textarea" oninput="compareHex()" placeholder="Hoặc dán chuỗi hex vào đây..."></textarea>
            </div>
        </div>
        <div class="diff-box">
            <h3>File 2 (Bạn có thể chỉnh sửa trực tiếp ở đây)</h3>
            <div class="editor-wrapper">
                <div id="backdrop2" class="backdrop"></div>
                <textarea id="text2" class="editable-textarea" oninput="compareHex()" placeholder="Hoặc dán chuỗi hex vào đây..."></textarea>
            </div>
            <button onclick="downloadFile()">Tải Về File 2 Đã Sửa</button>
        </div>
    </div>

<script>
    function loadFile(fileNum) {
        const fileInput = document.getElementById('file' + fileNum);
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const arrayBuffer = e.target.result;
            const bytes = new Uint8Array(arrayBuffer);
            let hexString = '';
            for (let i = 0; i < bytes.length; i++) {
                hexString += bytes[i].toString(16).padStart(2, '0').toUpperCase() + ' ';
            }
            document.getElementById('text' + fileNum).value = hexString.trim();
            compareHex();
        };
        reader.readAsArrayBuffer(file);
    }

    function compareHex() {
        const val1 = document.getElementById('text1').value.trim().split(/\s+/);
        const val2 = document.getElementById('text2').value.trim().split(/\s+/);
        
        let res1 = '', res2 = '';
        const maxLength = Math.max(val1.length, val2.length);

        for (let i = 0; i < maxLength; i++) {
            let b1 = val1[i] || '';
            let b2 = val2[i] || '';

            if (b1 !== b2) {
                res1 += `<span class="highlight">${escapeHtml(b1)}</span> `;
                res2 += `<span class="highlight">${escapeHtml(b2)}</span> `;
            } else {
                res1 += escapeHtml(b1) + ' ';
                res2 += escapeHtml(b2) + ' ';
            }
        }

        document.getElementById('backdrop1').innerHTML = res1 + ' ';
        document.getElementById('backdrop2').innerHTML = res2 + ' ';
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Đồng bộ cuộn chuột giữa textarea và lớp nền màu đỏ
    ['1', '2'].forEach(id => {
        const ta = document.getElementById('text' + id);
        const bd = document.getElementById('backdrop' + id);
        ta.addEventListener('scroll', () => {
            bd.scrollTop = ta.scrollTop;
            bd.scrollLeft = ta.scrollLeft;
        });
    });

    function downloadFile() {
        const textVal = document.getElementById('text2').value.trim().split(/\s+/);
        const byteArray = new Uint8Array(textVal.map(byte => parseInt(byte, 16) || 0));
        
        const blob = new Blob([byteArray]);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'edited_file.bin';
        link.click();
    }
</script>

</body>
</html>
